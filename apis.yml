name: Dimeq
description: 'Dimeq is a Norwegian maritime safety technology company working to prevent loss of life
  at sea and set new health, safety and environmental (HSE) standards for the maritime sector. Its Eye-D
  System is an IoT-based digital ecosystem that delivers real-time positioning of crew and passengers to
  one-meter accuracy during emergencies, man-overboard detection using environmental sensors, automatic
  mustering that registers people in seconds, and statistical analysis for accident documentation and
  prevention, while keeping data anonymous and GDPR-compliant outside of emergencies. The D-Router gateway
  supports Wi-Fi, Ethernet, PLC, fiber optics, UWB, Bluetooth, LoRa, ZigBee and MATTER connectivity. This
  is a hardware/IoT product company with no public developer portal, API, SDK or documentation surface at
  the time of enrichment.'
